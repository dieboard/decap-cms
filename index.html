<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Site</title>
  <style>
    body { font-family: sans-serif; line-height: 1.6; padding: 2em; }
    article { border-bottom: 1px solid #ccc; padding-bottom: 1em; margin-bottom: 1em; }
    h1 { color: #333; }
    h2 { color: #555; }
  </style>
</head>
<body>
  <h1>My Simple Site</h1>
  <div id="posts"></div>

  <script>
    // Fetch and display the content from the data file
    fetch('_data/posts.json')
      .then(response => response.json())
      .then(data => {
        const postsContainer = document.getElementById('posts');
        data.posts.forEach(post => {
          const postElement = document.createElement('article');
          postElement.innerHTML = `
            <h2>${post.title}</h2>
            <p><em>${new Date(post.date).toLocaleDateString()}</em></p>
            <div>${post.body}</div>
          `;
          postsContainer.appendChild(postElement);
        });
      })
      .catch(error => {
        console.error('Error fetching posts:', error);
        document.getElementById('posts').innerHTML = '<p>Could not load posts.</p>';
      });
  </script>
</body>
</html>
