<!DOCTYPE html>
<html>
<head>
  <title>{{ .Site.Title }}</title>
</head>
<body>
  <h1>Welcome to my site!</h1>
  <h2>Recent Posts</h2>
  <ul>
    {{ range .Site.RegularPages }}
      <li>
        <a href="{{ .Permalink }}">{{ .Title }}</a>
        <p>{{ .Date.Format "January 2, 2006" }}</p>
      </li>
    {{ end }}
  </ul>
</body>
</html>
